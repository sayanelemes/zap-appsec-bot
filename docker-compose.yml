services:
  # =================================================================
  # База данных PostgreSQL 16
  # =================================================================
  postgres:
    image: postgres:16-alpine
    container_name: bot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bot_password}
      POSTGRES_DB: ${POSTGRES_DB:-bot_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bot_user} -d ${POSTGRES_DB:-bot_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =================================================================
  # Хранилище сессий и кэш Redis (опционально)
  # =================================================================
  redis:
    image: redis:7-alpine
    container_name: bot_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  # =================================================================
  # Telegram-бот
  # =================================================================
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bot_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      # Автоматическое переопределение подключения внутри Docker сети
      DB_URL: postgresql+asyncpg://${POSTGRES_USER:-bot_user}:${POSTGRES_PASSWORD:-bot_password}@postgres:5432/${POSTGRES_DB:-bot_db}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
    # Автоматическое применение миграций Alembic перед запуском
    command: >
      sh -c "alembic upgrade head && python -m bot.main"

volumes:
  postgres_data:
  redis_data:
