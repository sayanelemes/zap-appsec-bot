services:
  # =================================================================
  # Демон OWASP ZAP (zaproxy)
  # =================================================================
  zap:
    image: zaproxy/zap-stable
    container_name: zap_daemon
    restart: always
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.key=${ZAP_API_KEY}
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    networks:
      - zap-network

  # =================================================================
  # Telegram-бот (ZAP AppSec AI Auditor)
  # =================================================================
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zap_bot_app
    restart: always
    depends_on:
      - zap
    env_file:
      - .env
    environment:
      ZAP_URL: http://zap:8080
    volumes:
      - ./logs:/app/logs
    networks:
      - zap-network
    command: ["python", "main.py"]

networks:
  zap-network:
    driver: bridge
